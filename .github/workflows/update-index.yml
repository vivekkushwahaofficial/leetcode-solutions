name: Update LeetCode Index & Documentation

on:
  push:
    branches:
      - main
      - master
    paths:
      - '[0-9]*-*/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'config.yml'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Cache LeetCode API Metadata
        uses: actions/cache@v4
        with:
          path: .cache
          key: leetcode-cache-${{ runner.os }}-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            leetcode-cache-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run Documentation & Statistics Generator
        run: python scripts/run_all.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(auto): regenerate portfolio README, pattern docs, and progress stats [skip ci]"
          file_pattern: "README.md docs/** stats/** .cache/leetcode_cache.json"
          skip_dirty_check: false
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"